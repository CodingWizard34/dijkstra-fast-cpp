<svg width="1000" height="740" viewBox="0 0 1000 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background Frame -->
  <rect width="1000" height="740" rx="16" fill="#181818"/>

  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Top Pill: Route planning -->
  <ellipse cx="500" cy="70" rx="110" ry="32" fill="#363636" stroke="#555555" stroke-width="1.5"/>
  <text x="500" y="76" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Route planning</text>

  <!-- Split Connectors from Top Pill -->
  <line x1="500" y1="102" x2="500" y2="160" stroke="#737373" stroke-width="1.5"/>
  <line x1="250" y1="160" x2="750" y2="160" stroke="#737373" stroke-width="1.5"/>
  <line x1="250" y1="160" x2="250" y2="205" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="160" x2="750" y2="205" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Column Headers -->
  <text x="250" y="145" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Frontend (HTML / JS)</text>
  <text x="750" y="145" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Backend (Streamlit)</text>

  <!-- ================= LEFT COLUMN: FRONTEND ================= -->
  <!-- Web Box -->
  <rect x="140" y="210" width="220" height="60" rx="12" fill="#363636" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="250" y="246" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Web</text>

  <line x1="250" y1="270" x2="250" y2="305" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JS Box -->
  <rect x="140" y="310" width="220" height="60" rx="12" fill="#363636" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="250" y="346" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">JS</text>

  <line x1="250" y1="370" x2="250" y2="405" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Canvas Box -->
  <rect x="140" y="410" width="220" height="60" rx="12" fill="#363636" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="250" y="446" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Canvas</text>

  <!-- ================= RIGHT COLUMN: BACKEND (Streamlit) ================= -->
  <!-- Python Box (Directly below Backend header) -->
  <rect x="640" y="210" width="220" height="60" rx="12" fill="#3C397B" stroke="#5652A3" stroke-width="1.5"/>
  <text x="750" y="246" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Python</text>

  <line x1="750" y1="270" x2="750" y2="305" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Route planning Box -->
  <rect x="640" y="310" width="220" height="60" rx="12" fill="#3C397B" stroke="#5652A3" stroke-width="1.5"/>
  <text x="750" y="346" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Route planning</text>

  <!-- Branching Connectors from Route Planning -->
  <line x1="750" y1="370" x2="750" y2="400" stroke="#737373" stroke-width="1.5"/>
  <line x1="600" y1="400" x2="840" y2="400" stroke="#737373" stroke-width="1.5"/>
  <line x1="600" y1="400" x2="600" y2="435" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="400" x2="840" y2="435" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pure Python Box (Left Sub-branch) -->
  <rect x="505" y="440" width="190" height="58" rx="12" fill="#3C397B" stroke="#5652A3" stroke-width="1.5"/>
  <text x="600" y="475" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Pure Python</text>

  <!-- Dijkstra Box (Right Sub-branch, Coral) -->
  <rect x="745" y="440" width="190" height="58" rx="12" fill="#963824" stroke="#B84A33" stroke-width="1.5"/>
  <text x="840" y="475" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Dijkstra</text>

  <!-- Arrow from Pure Python to Data framing -->
  <line x1="600" y1="498" x2="600" y2="535" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data framing Box -->
  <rect x="505" y="540" width="190" height="58" rx="12" fill="#3C397B" stroke="#5652A3" stroke-width="1.5"/>
  <text x="600" y="575" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Data framing</text>

  <!-- Connector from Data framing to Dijkstra (Bottom & Right) -->
  <path d="M 695 569 L 840 569 L 840 505" stroke="#737373" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ================= BOTTOM LEGEND ================= -->
  <rect x="140" y="650" width="18" height="18" rx="4" fill="#963824"/>
  <text x="168" y="664" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Coral: compiled with Cython, with a pure-Python fallback</text>

  <!-- Triple Dot Indicator (Bottom Center) -->
  <ellipse cx="500" cy="700" rx="18" ry="12" fill="#262626"/>
  <circle cx="493" cy="700" r="2" fill="#737373"/>
  <circle cx="500" cy="700" r="2" fill="#737373"/>
  <circle cx="507" cy="700" r="2" fill="#737373"/>
</svg>
